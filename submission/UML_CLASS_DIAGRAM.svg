<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <style>
    .box { fill:#f7fbff; stroke:#24527a; stroke-width:2; rx:8; }
    .title { fill:#dceeff; stroke:#24527a; stroke-width:2; }
    .text { font: 16px -apple-system, BlinkMacSystemFont, sans-serif; fill:#15202b; }
    .small { font: 14px -apple-system, BlinkMacSystemFont, sans-serif; fill:#15202b; }
    .line { stroke:#394b59; stroke-width:2; fill:none; }
    .dash { stroke:#394b59; stroke-width:2; fill:none; stroke-dasharray:8 6; }
  </style>
  <text x="600" y="34" text-anchor="middle" class="text" font-weight="bold">SCAPMS UML / Class Relationships</text>

  <rect x="425" y="60" width="350" height="120" class="box"/>
  <rect x="425" y="60" width="350" height="34" class="title"/>
  <text x="600" y="83" text-anchor="middle" class="text" font-weight="bold">«abstract» PatientRecord</text>
  <text x="445" y="118" class="small">patientId, fullName, age, contact</text>
  <text x="445" y="143" class="small">appointments; getCategory(); clone()</text>
  <text x="445" y="166" class="small">updateAppointmentStatus()</text>

  <rect x="55" y="260" width="260" height="110" class="box"/>
  <rect x="55" y="260" width="260" height="34" class="title"/>
  <text x="185" y="283" text-anchor="middle" class="text" font-weight="bold">GeneralPatient</text>
  <text x="75" y="320" class="small">preferredDoctor</text>
  <text x="75" y="345" class="small">display / clone / appointments</text>

  <rect x="470" y="260" width="260" height="110" class="box"/>
  <rect x="470" y="260" width="260" height="34" class="title"/>
  <text x="600" y="283" text-anchor="middle" class="text" font-weight="bold">EmergencyPatient</text>
  <text x="490" y="320" class="small">emergencyDescription, triageLevel</text>
  <text x="490" y="345" class="small">display / clone / appointments</text>

  <rect x="885" y="260" width="260" height="110" class="box"/>
  <rect x="885" y="260" width="260" height="34" class="title"/>
  <text x="1015" y="283" text-anchor="middle" class="text" font-weight="bold">FollowUpPatient</text>
  <text x="905" y="320" class="small">previousAppointmentId</text>
  <text x="905" y="345" class="small">followUpReason; display / clone</text>

  <path d="M600 180 L185 260 M600 180 L600 260 M600 180 L1015 260" class="line"/>
  <path d="M600 180 l-12 -20 l24 0 z M600 180 l-12 -20 l24 0 z M600 180 l-12 -20 l24 0 z" fill="#394b59"/>

  <rect x="40" y="470" width="250" height="100" class="box"/>
  <rect x="40" y="470" width="250" height="34" class="title"/>
  <text x="165" y="493" text-anchor="middle" class="text" font-weight="bold">«interface» Appointable</text>
  <text x="60" y="530" class="small">scheduleAppointment()</text>
  <text x="60" y="552" class="small">cancelAppointment(), hasAppointment()</text>
  <path d="M185 370 L165 470" class="dash"/>

  <rect x="370" y="450" width="300" height="145" class="box"/>
  <rect x="370" y="450" width="300" height="34" class="title"/>
  <text x="520" y="473" text-anchor="middle" class="text" font-weight="bold">ClinicDatabase</text>
  <text x="390" y="512" class="small">◆ vector&lt;PatientRecord&gt;</text>
  <text x="390" y="535" class="small">◆ vector&lt;Appointment&gt;</text>
  <text x="390" y="558" class="small">◆ WaitingQueue</text>
  <text x="390" y="581" class="small">findPatient(), findAppointment()</text>

  <rect x="810" y="450" width="330" height="145" class="box"/>
  <rect x="810" y="450" width="330" height="34" class="title"/>
  <text x="975" y="473" text-anchor="middle" class="text" font-weight="bold">ClinicManager / Controllers</text>
  <text x="830" y="512" class="small">PatientController, AppointmentController</text>
  <text x="830" y="535" class="small">QueueController, SearchEngine, SortEngine</text>
  <text x="830" y="558" class="small">ReportController, UndoController</text>
  <text x="830" y="581" class="small">coordinates ClinicDatabase operations</text>

  <rect x="370" y="680" width="300" height="90" class="box"/>
  <rect x="370" y="680" width="300" height="34" class="title"/>
  <text x="520" y="703" text-anchor="middle" class="text" font-weight="bold">Qt GUI Panels</text>
  <text x="390" y="740" class="small">MainWindow, PatientPanel, AppointmentPanel</text>
  <text x="390" y="761" class="small">QueuePanel, SearchSortPanel, ReportsPanel</text>

  <rect x="810" y="680" width="330" height="90" class="box"/>
  <rect x="810" y="680" width="330" height="34" class="title"/>
  <text x="975" y="703" text-anchor="middle" class="text" font-weight="bold">Appointment</text>
  <text x="830" y="740" class="small">id, patientId, date, time, doctor, purpose, status</text>
  <text x="830" y="761" class="small">Pending / Completed / Cancelled</text>

  <path d="M520 595 L520 680 M810 522 L670 522 M975 595 L975 680 M600 180 L520 450" class="line"/>
  <text x="710" y="510" class="small">composition</text>
  <text x="535" y="640" class="small">uses</text>
  <text x="990" y="640" class="small">association</text>
</svg>
